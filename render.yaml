services:
  - type: web
    name: sentiment-classifier
    runtime: python
    plan: free
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
    startCommand: uvicorn classification_practice:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: HF_TOKEN
        sync: false
