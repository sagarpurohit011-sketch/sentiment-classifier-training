<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment Classifier</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #657786;
      --paper: #f7f4ee;
      --panel: #fffdf8;
      --line: #ded8cc;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --positive: #16794c;
      --negative: #b42318;
      font-family: Georgia, 'Times New Roman', serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 100% 0%, #e8f0e7 0, transparent 38%), var(--paper);
    }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 12vh 0 8vh; }
    .kicker { margin: 0 0 12px; color: var(--accent); font: 700 0.8rem/1.2 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { max-width: 560px; margin: 0; font-size: clamp(2.6rem, 8vw, 5.2rem); line-height: 0.96; font-weight: 500; }
    .intro { max-width: 520px; margin: 22px 0 34px; color: var(--muted); font: 1.08rem/1.6 system-ui, sans-serif; }
    .panel { padding: clamp(20px, 5vw, 36px); border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: 0 18px 50px rgb(72 63 42 / 9%); }
    label { display: block; margin-bottom: 10px; font: 700 0.9rem/1.2 system-ui, sans-serif; }
    textarea { display: block; width: 100%; min-height: 150px; resize: vertical; padding: 14px; border: 1px solid #bdb6a8; border-radius: 4px; color: var(--ink); background: #fff; font: 1.05rem/1.5 system-ui, sans-serif; }
    textarea:focus { outline: 3px solid rgb(15 118 110 / 20%); border-color: var(--accent); }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; }
    .hint { color: var(--muted); font: 0.82rem system-ui, sans-serif; }
    button { border: 0; border-radius: 4px; padding: 12px 20px; color: #fff; background: var(--accent); cursor: pointer; font: 700 0.95rem system-ui, sans-serif; }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.55; cursor: wait; }
    [hidden] { display: none !important; }
    .status { margin-top: 20px; padding: 18px; border-left: 4px solid var(--accent); background: #eef6f2; font-family: system-ui, sans-serif; }
    .status strong { display: block; font-size: 1.35rem; letter-spacing: 0.04em; }
    .status p { margin: 6px 0 0; color: var(--muted); }
    .status.negative { border-color: var(--negative); background: #fff1ef; }
    .status.negative strong { color: var(--negative); }
    .status.positive strong { color: var(--positive); }
    .error { margin-top: 16px; color: var(--negative); font: 0.92rem system-ui, sans-serif; }
    @media (max-width: 520px) {
      main { padding-top: 9vh; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Text sentiment</p>
    <h1>What does your sentence feel like?</h1>
    <p class="intro">Enter a sentence and the classifier will estimate whether its sentiment is positive or negative.</p>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title" hidden>Classify text</h2>
      <form id="classifier-form">
        <label for="text">Your text</label>
        <textarea id="text" name="text" maxlength="5000" placeholder="I really enjoyed this course." required></textarea>
        <div class="actions">
          <span class="hint">Up to 5,000 characters</span>
          <button id="submit" type="submit">Classify</button>
        </div>
      </form>
      <div id="result" class="status" hidden aria-live="polite"></div>
      <p id="error" class="error" hidden role="alert"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#classifier-form');
    const textInput = document.querySelector('#text');
    const submitButton = document.querySelector('#submit');
    const result = document.querySelector('#result');
    const error = document.querySelector('#error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.hidden = true;
      error.hidden = true;
      submitButton.disabled = true;
      submitButton.textContent = 'Classifying...';

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: textInput.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Unable to classify the text.');

        const label = data.label.toUpperCase();
        result.className = `status ${label.toLowerCase()}`;
        result.innerHTML = `<strong>${label}</strong><p>Confidence: ${(data.score * 100).toFixed(1)}%</p>`;
        result.hidden = false;
      } catch (requestError) {
        error.textContent = requestError.message;
        error.hidden = false;
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Classify';
      }
    });
  </script>
</body>
</html>
